<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Streak Keeper</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <p class="eyebrow">STREAK KEEPER</p>
    <h1>Log in</h1>
    <p class="auth-copy">Continue tracking your habits.</p>

    <form id="login-form" class="auth-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <p id="auth-error" class="error" role="alert" hidden></p>
      <button id="submit-button" type="submit">Log in</button>
    </form>

    <p class="auth-switch">Don't have an account? <a href="/static/signup.html">Sign up</a></p>
  </main>

  <script>
    const form = document.querySelector("#login-form");
    const error = document.querySelector("#auth-error");
    const submitButton = document.querySelector("#submit-button");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.hidden = true;
      submitButton.disabled = true;

      const formData = new FormData(form);
      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({
            email: formData.get("email"),
            password: formData.get("password"),
          }),
        });

        if (!response.ok) {
          let message = "Unable to log in.";
          try {
            const body = await response.json();
            message = body.detail || message;
          } catch (_) {}
          throw new Error(message);
        }

        window.location.replace("/static/index.html");
      } catch (err) {
        error.textContent = err.message;
        error.hidden = false;
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
