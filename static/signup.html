<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up — Streak Keeper</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .auth-page { display: grid; place-items: center; min-height: 100vh; padding: 24px; background: #f5f7fb; }
    .auth-card { width: min(100%, 420px); padding: 28px; background: #fff; border: 1px solid #dfe4ee; border-radius: 16px; box-shadow: 0 10px 30px rgba(23, 32, 51, .08); }
    .auth-card h1 { margin: 0 0 6px; }
    .auth-copy { margin: 0 0 22px; color: #536078; }
    .auth-form { display: grid; gap: 9px; }
    .auth-form input { width: 100%; min-height: 48px; padding: 10px 12px; border: 1px solid #8f98aa; border-radius: 10px; font: inherit; }
    .auth-form .error { margin: 5px 0 0; }
    .auth-switch { margin: 20px 0 0; color: #536078; text-align: center; font-size: .9rem; }
    .auth-switch a { color: #263a75; font-weight: 800; }
  </style>
</head>
<body class="auth-page">
  <main class="auth-card">
    <p class="eyebrow">STREAK KEEPER</p>
    <h1>Create account</h1>
    <p class="auth-copy">Start tracking your habits.</p>

    <form id="signup-form" class="auth-form">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>

      <p id="auth-error" class="error" role="alert" hidden></p>
      <button id="submit-button" type="submit">Sign up</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="/static/login.html">Log in</a></p>
  </main>

  <script>
    const form = document.querySelector("#signup-form");
    const error = document.querySelector("#auth-error");
    const submitButton = document.querySelector("#submit-button");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.hidden = true;
      submitButton.disabled = true;

      const formData = new FormData(form);
      try {
        const response = await fetch("/api/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({
            email: formData.get("email"),
            password: formData.get("password"),
          }),
        });

        if (!response.ok) {
          let message = "Unable to create account.";
          try {
            const body = await response.json();
            message = body.detail || message;
          } catch (_) {}
          throw new Error(message);
        }

        window.location.replace("/static/index.html");
      } catch (err) {
        error.textContent = err.message;
        error.hidden = false;
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
